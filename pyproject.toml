[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-log"
version = "0.9.0"
description = "Searchable web service for a Slack workspace archive — dynamic pages + full-text search, on top of slackdump"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xie Yanbo" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "emoji>=2.0",
    "tqdm>=4.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["ruff>=0.15"]

[project.scripts]
slack-log-split  = "slack_log.splitter:main"
slack-log-attach = "slack_log.attach:main"
slack-log-render = "slack_log.render:main"
slack-log-index  = "slack_log.indexer:main"
slack-log-serve  = "slack_log.server:main"

[project.urls]
Repository = "https://github.com/xyb/slack-log"

[tool.setuptools.packages.find]
include = ["slack_log*"]

[tool.setuptools.package-data]
slack_log = ["templates/static/*.html", "templates/server/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
