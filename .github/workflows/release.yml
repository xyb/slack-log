name: Release

# Pushing a vX.Y.Z tag builds and publishes the Docker image. The image tag
# is derived from the git tag; the job fails if the tag and pyproject.toml
# version disagree.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating the GitHub Release
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "git tag=$tag · pyproject version=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::git tag v$tag does not match pyproject version $proj"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: xieyanbo/slack-log
          # default flavor latest=auto → a non-prerelease semver tag also
          # moves :latest. Deployments still pin an exact version.
          tags: type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
