name: Release

# Pushing a vX.Y.Z tag builds and publishes the Docker image. The image tag
# is derived from the git tag; the job fails if the tag and pyproject.toml
# version disagree.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating the GitHub Release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true  # need every tag to find the highest version

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "git tag=$tag · pyproject version=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::git tag v$tag does not match pyproject version $proj"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: xieyanbo/slack-log
          # latest=false here — metadata-action only checks "is prerelease",
          # not "is highest version". :latest is moved by the explicit
          # highest-version step below so an older patch can't drag it back.
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Move :latest if this is the highest version
        # metadata-action can't compare versions. Decide here: only move
        # :latest when this tag is the highest X.Y.Z release tag, so
        # publishing an older patch after a newer one never drags it back.
        run: |
          highest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "this tag=$GITHUB_REF_NAME · highest release tag=$highest"
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then
            docker buildx imagetools create -t xieyanbo/slack-log:latest \
              "xieyanbo/slack-log:${GITHUB_REF_NAME#v}"
            echo "::notice::moved :latest to ${GITHUB_REF_NAME#v}"
          else
            echo "::notice::$GITHUB_REF_NAME is not the highest release ($highest) — :latest unchanged"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
