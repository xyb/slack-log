# Data-refresh CronJob: slackdump archive → split → attach → render → index.
# Writes the shared PVC the web Deployment reads, so a successful run is
# immediately live with no manual copy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: slack-log-refresh
  namespace: slack-log
spec:
  schedule: "0 19 * * *"          # 03:00 Asia/Shanghai (UTC+8) daily
  concurrencyPolicy: Forbid       # never overlap — single RWO volume
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: slack-log-refresh
        spec:
          restartPolicy: Never
          # Shared seLinux level — see deployment.yaml.
          securityContext:
            seLinuxOptions:
              level: "s0"
          # Optional — pin to a node pool / tolerate taints on your cluster:
          # nodeSelector:
          #   your.cluster/nodepool: your-pool
          # tolerations:
          #   - key: your.cluster/dedicated
          #     operator: Equal
          #     value: "true"
          #     effect: NoSchedule
          # RWO volume — the refresh pod must land on the same node as the
          # web pod that currently holds the mount.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: slack-log
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: refresh
              image: xieyanbo/slack-log:0.9.0
              command: ["sh", "scripts/refresh.sh"]
              volumeMounts:
                - name: data
                  mountPath: /data
              envFrom:
                - configMapRef:
                    name: slack-log-config
                - secretRef:
                    name: slack-log-secrets
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: slack-log-data
